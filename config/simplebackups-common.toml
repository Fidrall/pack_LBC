# Monde prégénéré sur 20 000 blocs (plusieurs dizaines de Go, disque MineStrator 140 Go).
# Les fichiers du monde sont déjà compressés : une sauvegarde complète pèse presque autant que le monde.
# -> une sauvegarde complète par semaine, et toutes les 2 h seulement les fichiers modifiés depuis (petites).
# Compression désactivée (0) : gain quasi nul sur des fichiers déjà compressés, et beaucoup moins de processeur.
backupType = "MODIFIED_SINCE_FULL"
fullBackupTimer = 10080
timer = 120
backupsToKeep = 48
maxDiskSize = "70 GB"
compressionLevel = 0
