[[mods]]
modId = "lbcfixes"
version = "1.0.0"
displayName = "pack_LBC Fixes"
authors = "Fidrall"
description = '''Correctifs du pack pack_LBC (mixins uniquement) :
- Wyrmroost : eclair monte du Butterfly Leviathan (portee de visee, cible conservee)
- FTB Chunks : pas de mise a jour de la minimap quand elle est desactivee
- Somake Spells : effet de la zone Pumpkin Bomb enregistre (plus d'expulsion via Neruina)
- Infested Swarms and Spiders : oeufs d'araignee seulement sur une araignee tuee par un joueur, une fois sur deux
- Petting : ne gere que ses propres familiers (chevaux, dragons Wyrmroost, chiens... gardent leur clic droit), volants des mods (Aerwhale) pilotes en vol
- Apotheosis : apres une baisse de palier, une heure de jeu avant de pouvoir remonter
- Boss : +50 % de vie par joueur en plus a 48 blocs (tag pack_lbc:boss_multijoueur)
- Boss : un sac de butin par joueur a 300 blocs, dans l'inventaire (tags pack_lbc:butin_boss/*)'''

[[mixins]]
config = "lbcfixes.mixins.json"

[[dependencies.lbcfixes]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.lbcfixes]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"
